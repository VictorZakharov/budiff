version: 2
updates:
  # Package versions are pinned in SPEC.md section 3 - update it with a bump.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      tests:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

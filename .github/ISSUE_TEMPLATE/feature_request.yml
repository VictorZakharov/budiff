name: Feature request
description: Suggest an improvement
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        budiff aims to stay small and read-only: "ls for diffs". Proposals that fit that
        are the most likely to land.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

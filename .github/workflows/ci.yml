name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Packaging and publishing live in release.yml. The Integration filter
  # stays on Linux too: the runner ships Node, which defeats those tests'
  # toolchain self-skip.
  build-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Budiff.slnx

      - name: Build
        run: dotnet build Budiff.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Budiff.slnx -c Release --no-build --filter "Category!=Integration"

  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Budiff.slnx

      - name: Build
        run: dotnet build Budiff.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Budiff.slnx -c Release --no-build --filter "Category!=Integration"

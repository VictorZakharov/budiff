name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Budiff.slnx

      - name: Build
        run: dotnet build Budiff.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Budiff.slnx -c Release --no-build --filter "Category!=Integration"

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack Budiff.slnx -c Release --no-build -o artifacts/packages

      - name: Publish CLI
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/Budiff.Cli/Budiff.Cli.csproj -c Release --no-build -o artifacts/cli

      - name: Publish GUI
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/Budiff.App/Budiff.App.csproj -c Release --no-build -o artifacts/app

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: budiff-release-artifacts
          path: artifacts/**

      - name: Push NuGet packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            dotnet nuget push artifacts/packages/*.nupkg --skip-duplicate --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          }

      - name: Attach release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**

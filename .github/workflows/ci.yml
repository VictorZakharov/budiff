name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Pull requests keep a linear history: rebased onto main, never merged into
  # (main gets merge commits only, from merging pull requests).
  linear-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No merge commits in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE..$HEAD")
          if [ -n "$merges" ]; then
            echo "::error::This pull request contains merge commits. Rebase it onto main instead of merging."
            git log --oneline --merges "$BASE..$HEAD"
            exit 1
          fi

  # Packaging and publishing live in release.yml. The Integration filter
  # stays on Linux too: the runner ships Node, which defeats those tests'
  # toolchain self-skip.
  build-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Budiff.slnx

      - name: Build
        run: dotnet build Budiff.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Budiff.slnx -c Release --no-build --filter "Category!=Integration"

  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Budiff.slnx

      - name: Build
        run: dotnet build Budiff.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Budiff.slnx -c Release --no-build --filter "Category!=Integration"
